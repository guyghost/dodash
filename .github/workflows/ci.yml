name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Deploy the four Cloudflare Workers after verification
        required: false
        type: boolean
        default: false
      release_sha:
        description: Exact 40-character Git SHA to verify and deploy live-OFF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_LOG_PATH: /tmp/dodash-wrangler.log

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable release SHA input
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the pre-push quality gate
        run: pnpm verify:push
      - name: Test release evidence generation
        run: pnpm test:release-evidence
      - name: Generate immutable live-OFF release evidence
        run: |
          node scripts/generate-release-evidence.mjs \
            --release-sha "$(git rev-parse HEAD)" \
            --generated-at "$(node -p 'new Date().toISOString()')" \
            --output .artifacts/releases/release-evidence.json
      - name: Upload live-OFF release evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ github.run_id }}
          path: .artifacts/releases/release-evidence.json
          if-no-files-found: error
          retention-days: 90

  deploy-workers:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_workers
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DASHBOARD_HEALTH_URL: ${{ secrets.DASHBOARD_HEALTH_URL }}
      DASHBOARD_API_PROBE_URL: ${{ secrets.DASHBOARD_API_PROBE_URL }}
    steps:
      - name: Validate immutable release SHA input
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify immutable release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Build workspace packages
        run: pnpm build
      - name: Force live execution OFF before deployment
        run: printf '%s' false | pnpm --filter @dodash/agent exec wrangler secret put LIVE_TRADING_ENABLED
      # The three private Workers run with workers_dev disabled, so
      # `wrangler deploy` only uploads a version and never promotes it. Each
      # deploy step captures the uploaded version ID and promotes it to 100%
      # explicitly.
      - name: Deploy market data Worker
        run: |
          if ! output=$(pnpm --filter @dodash/mcp-market-data exec wrangler deploy 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          version_id=$(printf '%s\n' "$output" | sed -n 's/^Current Version ID: //p')
          test -n "$version_id"
          pnpm --filter @dodash/mcp-market-data exec wrangler versions deploy --version-id "$version_id" --percentage 100 --yes
      - name: Deploy Trading Agent Worker
        run: |
          if ! output=$(pnpm --filter @dodash/agent exec wrangler deploy 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          version_id=$(printf '%s\n' "$output" | sed -n 's/^Current Version ID: //p')
          test -n "$version_id"
          pnpm --filter @dodash/agent exec wrangler versions deploy --version-id "$version_id" --percentage 100 --yes
      - name: Deploy dashboard API Worker
        run: |
          if ! output=$(pnpm --filter @dodash/dashboard-api exec wrangler deploy 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          version_id=$(printf '%s\n' "$output" | sed -n 's/^Current Version ID: //p')
          test -n "$version_id"
          pnpm --filter @dodash/dashboard-api exec wrangler versions deploy --version-id "$version_id" --percentage 100 --yes
      - name: Build dashboard assets
        run: pnpm --filter @dodash/dashboard build
      - name: Deploy dashboard Worker
        run: pnpm --filter @dodash/dashboard exec wrangler deploy
      # Only the dashboard Worker is internet-facing; the three private
      # Workers have no reachable workers.dev URL by design. The smoke test
      # asserts the public health JSON body and that an unauthenticated API
      # request traverses dashboard -> dashboard-api and is rejected with 401,
      # which proves the service bindings and the private chain are live.
      - name: Smoke test public health and the private API chain
        run: |
          test -n "$DASHBOARD_HEALTH_URL"
          test -n "$DASHBOARD_API_PROBE_URL"
          # Bounded retries: right after a version promotion the edge can
          # briefly serve a stale 200 body, so assert on the body in a loop
          # instead of relying on curl --fail alone.
          health_ok=""
          for attempt in 1 2 3 4 5 6 7 8 9; do
            body=$(curl --silent --show-error "$DASHBOARD_HEALTH_URL?run=${GITHUB_RUN_ID}")
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              health_ok=1
              break
            fi
            sleep 10
          done
          test -n "$health_ok"
          # The API enforces strict routing: query params are only legal on
          # cycles?limit=N, so the probe URL must stay untouched (no
          # cache-buster) or the response is 404 instead of 401.
          status=$(curl --silent --output /tmp/probe-body.json --write-out '%{http_code}' "$DASHBOARD_API_PROBE_URL")
          test "$status" = "401"
          grep -q 'UNAUTHORIZED' /tmp/probe-body.json
