packages:
  - models
  - packages/*
  - apps/*
# Keep installs and script runners on the project's existing node_modules/.pnpm layout.
enableGlobalVirtualStore: false
overrides:
  # Patch undici advisories without changing either transitive major version.
  "undici@>=7 <8": 7.30.1
  # Audit du 2026-10-31 : undici 8.x < 8.12.2 (transitif) — montée mineure.
  "undici@>=8 <9": 8.12.2
  fast-uri: ^3.1.6
  # GHSA-rgj7-g3m4-5g8c / GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545 — libheif via wrangler>miniflare ;
  # 0.35.5 corrige en plus la vulnérabilité librsvg (audit du 2026-10-07). Épingle exacte.
  sharp: 0.35.5
  # Audit du 2026-10-07 (pnpm audit --audit-level=high), transitifs sans changement de majeure :
  # proxy-addr — usurpation d'IP via IPv4 mappée (agents>@modelcontextprotocol/sdk>express).
  proxy-addr: ^2.0.8
  # GHSA-6qxp-vccf-f47h — le client OAuth MCP pouvait envoyer des identifiants à un serveur choisi par le serveur MCP (via agents).
  "@modelcontextprotocol/sdk": ^1.31.0
  "@modelcontextprotocol/client": ^2.2.0
  # Audit du 2026-10-31 (pnpm audit --audit-level=high) :
  # GHSA-f897-62hf-6gxq — @modelcontextprotocol/server (direct mcp + via agents), montée 2.x.
  "@modelcontextprotocol/server": ">=2.3.0"
  # zod < 4.6.6 — montée mineure sur toute la ligne 4.x.
  zod: ">=4.6.6"
  # vite < 8.2.4 (agents>vite) et body-parser < 2.4.0 (transitifs).
  vite: ">=8.2.4"
  body-parser: ">=2.4.0"
  # follow-redirects < 1.16.1 (transitif).
  follow-redirects: ">=1.16.1"
  # source-map-js — déni de service de la boucle d'événements (agents>vite>postcss).
  source-map-js: ^1.2.2
allowBuilds:
  core-js-pure: false
  esbuild: true
  hyperliquid: false
  simple-git-hooks: false
  workerd: true
patchedDependencies:
  tau-prolog@0.3.4: patches/tau-prolog@0.3.4.patch
